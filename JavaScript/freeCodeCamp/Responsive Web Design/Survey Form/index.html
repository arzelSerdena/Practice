<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survey Form</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1 id="title">freeCodeCamp Survey Form</h1>
      <p id="description">
        Thank you for taking time to help us improve the platform
      </p>
      <div class="form-container">
        <form action="post" id="survey-form">
          <div class="section-container">
            <label for="name" id="name-label">Name</label>
            <input
              type="text"
              id="name"
              required
              placeholder="Enter your name"
              class="text-input"
            />
          </div>

          <div class="section-container">
            <label for="email" id="email-label">Email</label>
            <input
              type="email"
              id="email"
              required
              placeholder="Enter your email"
              class="text-input"
            />
          </div>

          <div class="section-container">
            <label for="age" id="number-label"
              >Age<span>(optional)</span></label
            >
            <input
              type="number"
              id="number"
              placeholder="Enter your age"
              min="15"
              max="55"
              class="text-input"
            />
          </div>

          <div class="section-container">
            <legend for="">
              Which option best describes your current role?
            </legend>
            <select name="" id="dropdown" class="text-input">
              <option value="">Select current role</option>
              <option value="">Student</option>
              <option value="">Full Time Job</option>
              <option value="">Full Time Learner</option>
              <option value="">Prefer not to say</option>
              <option value="">Other</option>
            </select>
          </div>

          <div class="section-container">
            <legend for="">
              Would you recommend freeCodeCamp to a friend?
            </legend>
            <div>
              <input
                type="radio"
                id="definitely"
                name="recommend"
                value="definitely"
              />
              <label for="definitely">Definitely</label>
            </div>
            <div>
              <input type="radio" id="maybe" name="recommend" value="maybe" />
              <label for="maybe">Maybe</label>
            </div>
            <div>
              <input
                type="radio"
                id="not-sure"
                name="recommend"
                value="not-sure"
              />
              <label for="not-sure">Not sure</label>
            </div>
          </div>

          <div class="section-container">
            <legend for="">
              What is your favorite feature of freeCodeCamp
            </legend>
            <select name="" id="" class="text-input">
              <option value="">Select an option</option>
              <option value="">Challenges</option>
              <option value="">Projects</option>
              <option value="">Community</option>
              <option value="">Open Source</option>
            </select>
          </div>

          <div class="section-container">
            <legend>
              What would you like to see improved?
              <span>(Check all that apply)</span>
            </legend>
            <div>
              <input
                type="checkbox"
                name="improvements"
                id="front-end"
                value="front-end"
              />
              <label for="front-end">Front-end Projects</label>
            </div>
            <div>
              <input
                type="checkbox"
                name="improvements"
                id="back-end"
                value="back-end"
              />
              <label for="back-end">Back-end Projects</label>
            </div>
            <div>
              <input
                type="checkbox"
                name="improvements"
                id="data-visualization"
                value="data-visualization"
              />
              <label for="data-visualization">Data Visualization</label>
            </div>
            <div>
              <input
                type="checkbox"
                name="improvements"
                id="challenges"
                value="challenges"
              />
              <label for="challenges">Challenges</label>
            </div>
            <div>
              <input
                type="checkbox"
                name="improvements"
                id="open-source"
                value="open-source"
              />
              <label for="open-source">Open Source Community</label>
            </div>
            <div>
              <input
                type="checkbox"
                name="improvements"
                id="gitter"
                value="gitter"
              />
              <label for="gitter">Gitter help rooms</label>
            </div>
            <div>
              <input
                type="checkbox"
                name="improvements"
                id="videos"
                value="videos"
              />
              <label for="videos">Videos</label>
            </div>
            <div>
              <input
                type="checkbox"
                name="improvements"
                id="meetups"
                value="meetups"
              />
              <label for="meetups">City Meetups</label>
            </div>
            <div>
              <input
                type="checkbox"
                name="improvements"
                id="wiki"
                value="wiki"
              />
              <label for="wiki">Wiki</label>
            </div>
            <div>
              <input
                type="checkbox"
                name="improvements"
                id="forum"
                value="forum"
              />
              <label for="forum">Forum</label>
            </div>
            <div>
              <input
                type="checkbox"
                name="improvements"
                id="additional-courses"
                value="additional-courses"
              />
              <label for="additional-courses">Additional Courses</label>
            </div>
          </div>

          <div class="section-container">
            <label for="">Any comments or suggestions?</label>
            <textarea
              name=""
              id=""
              placeholder="Enter your comment here..."
            ></textarea>
          </div>

          <button id="submit">Submit</button>
        </form>
      </div>
    </div>
  </body>
</html>
